[project]
name = "yoneylem"
version = "0.1.0"
description = "Yoneylem Arastirmasi chatbot: real LP/IP solving (PuLP) and queueing formulas behind a natural-language interface"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "google-genai>=1.0",
    "pulp>=2.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
